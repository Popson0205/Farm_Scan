<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check a farm report · GeoEstate FarmScan</title>
<style>
  :root { --green: #1f5c33; --navy: #1b2b5e; --ink: #1a1f1c; --muted: #5c6b62; --bg: #f7f4ee; --card: #fff; --border: #dde5df; --bad: #8a2b16; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: linear-gradient(135deg, #14361f, var(--green)); color: #fff; padding: 14px 16px; font-weight: 700; }
  main { max-width: 560px; margin: 24px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  h1 { font-size: 20px; margin: 0 0 6px; color: var(--navy); }
  p { color: var(--muted); line-height: 1.5; }
  form { display: flex; gap: 8px; margin: 12px 0; }
  input { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font: inherit; text-transform: uppercase; }
  button { padding: 10px 14px; border: 0; border-radius: 8px; background: var(--green); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  dl { display: grid; grid-template-columns: 9rem 1fr; gap: 6px 12px; margin: 12px 0 0; }
  dt { color: var(--muted); } dd { margin: 0; font-weight: 600; }
  .ok { color: var(--green); font-weight: 700; } .bad { color: var(--bad); font-weight: 700; }
</style>
</head>
<body>
<header>🌾 GeoEstate FarmScan</header>
<main><div class="card">
  <h1>Check a farm verification report</h1>
  <p>Type the number printed on the report (it starts with FSV-) to see that GeoEstate issued it, and to whom.</p>
  <form id="f"><label for="code" style="position:absolute;left:-9999px;">Report number</label><input id="code" placeholder="FSV-XXXXXXXX" autocomplete="off"><button>Check</button></form>
  <div id="out" role="status"></div>
</div></main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function check(code) {
  const out = document.getElementById('out');
  out.textContent = 'Checking…';
  try {
    const r = await (await fetch(`/api/verify/${encodeURIComponent(code)}`)).json();
    out.innerHTML = r.valid
      ? `<p class="ok">Genuine: GeoEstate FarmScan issued this report.</p><dl>
          <dt>Report</dt><dd>${esc(r.code)}</dd><dt>Issued to</dt><dd>${esc(r.issued_to)}</dd>
          <dt>Issued</dt><dd>${esc(new Date(r.issued_at).toLocaleString('en-GB', { dateStyle: 'long', timeStyle: 'short' }))}</dd>
          <dt>Farm</dt><dd>${esc(r.farm)}</dd><dt>Area</dt><dd>${esc(Number(r.area_ha).toLocaleString())} ha</dd>
          ${r.where ? `<dt>Where</dt><dd>${esc(r.where)}</dd>` : ''}
          <dt>Seasons read</dt><dd>${r.seasons.length ? esc(r.seasons.join(', ')) : 'none'}</dd></dl>
         <p>Compare these with the report you hold: if any differ, it has been changed.</p>`
      : `<p class="bad">No report with the number ${esc(code)} was issued by GeoEstate FarmScan.</p>`;
  } catch { out.textContent = 'Could not check just now. Try again.'; }
}
document.getElementById('f').onsubmit = e => { e.preventDefault(); const c = document.getElementById('code').value.trim(); if (c) check(c); };
const q = new URLSearchParams(location.search).get('code');
if (q) { document.getElementById('code').value = q; check(q); }
</script>
</body>
</html>
