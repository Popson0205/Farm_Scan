name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest against PostgreSQL with PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: hub, POSTGRES_PASSWORD: hub, POSTGRES_DB: farm_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hub" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: postgresql://hub:hub@localhost:5432/farm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
